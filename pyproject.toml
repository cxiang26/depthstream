[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "depthstream"
version = "0.1.0"
description = "Training-free amortized video depth streaming for tiny monocular depth models"
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
authors = [{ name = "DepthStream contributors" }]
keywords = ["depth estimation", "video", "real-time", "optical flow", "tensorrt"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Image Recognition",
  "License :: OSI Approved :: Apache Software License",
]
dependencies = [
  "numpy",
  "opencv-python-headless>=4.8",
  "onnxruntime>=1.19",
]

[project.optional-dependencies]
trt = ["tensorrt", "torch"]
hf = ["huggingface_hub"]
eval = ["matplotlib", "pillow", "piexif", "huggingface_hub", "timm", "einops", "torch"]
dev = ["pytest"]

[project.scripts]
depthstream = "depthstream.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
